name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first — no point burning minutes
# on a commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend — flake8 + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the local venv (3.13.2). Kept in step so a mismatch shows up
          # here rather than as a mystery failure.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        # flake8 is pinned in requirements.txt (7.0.0); installing it separately
        # here would let CI drift to a different version than local.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install spaCy model
        # keyword_extractor.py calls spacy.load("en_core_web_sm") at module
        # import scope, and app/api/v1/ai.py imports it — so without the model
        # even test *collection* fails, not just the tests that use it.
        run: python -m spacy download en_core_web_sm

      - name: flake8
        run: flake8 app tests

      - name: pytest
        # No OPENAI_API_KEY is set. That is deliberate: the suite must pass
        # without secrets, and test_openai_service_initialization asserts
        # against a patched environment rather than a live key.
        run: pytest -q

  frontend:
    name: frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 LTS rather than the local Node 26. react-scripts 5.0.1 is
          # unmaintained and not tested against 26; pinning the LTS here keeps
          # CI deterministic. Revisit when the Vite migration lands.
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        # The build script sets DISABLE_ESLINT_PLUGIN, so warnings do not fail
        # it. Lint is a separate, currently non-blocking step below.
        run: npm run build

      - name: Lint (non-blocking)
        # 96 warnings, 0 errors at the time of writing. Most are unused locals
        # belonging to unfinished features, so failing on them would block work
        # rather than protect it. Visible here, enforced later.
        run: npm run lint
        continue-on-error: true
