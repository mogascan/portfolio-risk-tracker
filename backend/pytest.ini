[pytest]
# Makes `app` importable so tests run from the repo root as well as backend/.
pythonpath = .

testpaths = tests

# test_ai_context / test_context_protection / test_query use bare `async def`
# tests with no decorator; auto mode collects them without per-test markers.
asyncio_mode = auto

filterwarnings =
    ignore::DeprecationWarning:pydantic.*
